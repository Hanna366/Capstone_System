<!DOCTYPE html>
<html>
<head>
    <title>Blynk API Test</title>
</head>
<body>
    <h1>Blynk API Token Test</h1>
    <p>Enter your Blynk Auth Token to test:</p>
    <input type="text" id="token" placeholder="Your Blynk Auth Token" style="width: 400px; padding: 10px;">
    <button onclick="testToken()" style="padding: 10px; background: #007cba; color: white; border: none; cursor: pointer;">Test Token</button>
    <div id="result" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc;"></div>

    <script>
        async function testToken() {
            const token = document.getElementById('token').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch(`https://blynk.cloud/external/api/get?token=${token}&V0,V1,V2,V3,V4,V5,V6,V7,V8,V9`);
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `
                        <h3>✅ Success! Token is valid</h3>
                        <p><strong>Device Data:</strong></p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <h3>❌ Token Test Failed</h3>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Status Text:</strong> ${response.statusText}</p>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3>❌ Network Error</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
